version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-postgres
    environment:
      POSTGRES_USER: vibe_admin
      POSTGRES_PASSWORD: vibe_admin_password_change_me
      POSTGRES_DB: vibe_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  hasura:
    image: hasura/graphql-engine:v2.38.0
    container_name: vibe-hasura
    ports:
      - "8080:8080"
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: your_admin_secret_change_me_make_it_longer_and_secure
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"your_jwt_secret_change_me_make_it_at_least_32_characters"}'
      HASURA_GRAPHQL_DATABASE_URL: postgres://vibe_admin:vibe_admin_password_change_me@postgres:5432/vibe_platform
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - HASURA_GRAPHQL_URL=http://hasura:8080
      - HASURA_ADMIN_SECRET=your_admin_secret_change_me_make_it_longer_and_secure
      - JWT_SECRET=your_jwt_secret_change_me_make_it_at_least_32_characters
      - DATABASE_URL=postgresql+asyncpg://vibe_admin:vibe_admin_password_change_me@postgres:5432/vibe_platform
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:5173"]
    depends_on:
      - hasura
      - redis
      - postgres
    volumes:
      - ./src:/app/src
    command: uvicorn vibe_coding.main:app --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    container_name: vibe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
